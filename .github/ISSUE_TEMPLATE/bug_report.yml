name: Bug report
description: Report a reproducible bug
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include DAW, OS, plugin format, sample rate and block size.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / diagnostics
