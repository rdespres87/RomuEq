# .github/workflows/release.yml
#
# Triggered ONLY on pushing a version tag `v*` (e.g. `v1.0.0`) or manual
# workflow_dispatch — never on regular pushes to `main`.
# Uses RELEASE_NOTES.md committed in the tagged commit (with fallback generation
# if absent), builds the combined macOS DMG (AUv2/VST3/CLAP plugins +
# Equaform-8.app standalone) and Windows installer, and publishes the GitHub
# Release. Never pushes back to `main` (compatible with branch protection).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release Metadata & Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
      tag: ${{ steps.gen.outputs.tag }}

    steps:
      - name: Resolve target release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          if ! printf '%s\n' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag '${TAG}' (expected vX.Y.Z, e.g. v1.0.0)."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Prepare RELEASE_NOTES.md
        id: gen
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [ -s RELEASE_NOTES.md ]; then
            echo "Using committed RELEASE_NOTES.md from ${TAG}"
            cp RELEASE_NOTES.md /tmp/RELEASE_NOTES.md
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "RELEASE_NOTES.md missing in ${TAG}; generating fallback notes."
            chmod +x scripts/generate-release-notes.sh
            ./scripts/generate-release-notes.sh --version "${TAG}" --output /tmp/RELEASE_NOTES.md --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Upload RELEASE_NOTES.md artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: /tmp/RELEASE_NOTES.md

  build-macos:
    name: Build & Package macOS DMG (Plugins + Standalone)
    runs-on: macos-latest
    needs: prepare-release
    timeout-minutes: 45

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64

      - name: Install build tools (CMake & Ninja)
        run: brew install cmake ninja

      - name: Build and package macOS DMG (Plugins + Standalone)
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-distribution-plugins.sh scripts/package-macos-app.sh scripts/build-driver.sh
          ./scripts/package-distribution-plugins.sh "${VERSION}"

      - name: Verify macOS DMG and SHA-256 checksum
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          DMG="target/release/dist/Equaform-8-v${VERSION}.dmg"
          SHA="${DMG}.sha256"
          if [ ! -f "${DMG}" ] || [ ! -f "${SHA}" ]; then
            echo "::error::Missing expected macOS DMG or SHA-256 file in target/release/dist/"
            ls -la target/release/dist/ || true
            exit 1
          fi
          echo "Generated DMG: ${DMG} ($(du -h "${DMG}" | cut -f1))"
          echo "SHA-256: $(cat "${SHA}")"
          (cd target/release/dist && shasum -a 256 -c "$(basename "${SHA}")")

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            target/release/dist/Equaform-8-v*.dmg
            target/release/dist/Equaform-8-v*.dmg.sha256

  build-windows:
    name: Build & Package Windows Plugins (x64)
    runs-on: windows-latest
    needs: prepare-release
    timeout-minutes: 45

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja & Inno Setup
        shell: pwsh
        run: |
          choco install ninja innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build equaform-plugin (CLAP DLL)
        run: cargo build --release -p equaform-plugin --target x86_64-pc-windows-msvc

      - name: Export 15 factory presets
        run: cargo run --release -p equaform-gui --example dump_factory_presets -- target/release/staging/presets

      - name: Assemble CLAP bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release/bundle
          Copy-Item -Path target/x86_64-pc-windows-msvc/release/equaform_plugin.dll -Destination target/release/bundle/Equaform-8.clap

      - name: Build VST3 wrapper via CMake & Ninja
        shell: pwsh
        run: |
          $clapPath = "$((Get-Location).Path)/target/release/bundle/Equaform-8.clap"
          $outDir = "$((Get-Location).Path)/target/release/bundle"
          cmake -G Ninja -S driver/clap-wrapper-equaform -B target/clap-wrapper-build `
            -DCMAKE_BUILD_TYPE=Release `
            -DEQUAFORM_CLAP_BUNDLE="$clapPath" `
            -DEQUAFORM_BUNDLE_OUT_DIR="$outDir"
          cmake --build target/clap-wrapper-build --target equaform_vst3

      - name: Compile Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path target/release/dist
          ISCC.exe "/DMyAppVersion=$env:VERSION" scripts/distribution/windows/installer.iss

      - name: Generate SHA-256 checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $installer = Get-Item "target/release/dist/Equaform-8-Plugins-Windows-v$env:VERSION.exe"
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          Set-Content -Path "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)"
          Write-Host "Generated installer: $($installer.FullName)"
          Write-Host "SHA-256: $hash"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            target/release/dist/Equaform-8-Plugins-Windows-v*.exe
            target/release/dist/Equaform-8-Plugins-Windows-v*.exe.sha256

  publish:
    name: Publish GitHub Release (macOS + Windows)
    runs-on: ubuntu-latest
    needs: [prepare-release, build-macos, build-windows]

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-assets/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets/

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: "Equaform-8 ${{ needs.prepare-release.outputs.tag }}"
          body_path: release-notes/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
