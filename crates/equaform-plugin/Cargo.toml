[package]
name = "equaform-plugin"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
equaform-common.workspace = true
equaform-engine.workspace = true
equaform-analysis = { path = "../equaform-analysis" }
equaform-gui = { path = "../equaform-gui", default-features = false }
clack-plugin = "0.1"
clack-common = "0.1"
clap-sys = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.31"
egui-wgpu = "0.31"
wgpu = "30"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSTimer", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSGraphics", "NSPasteboard", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
] }

[lib]
crate-type = ["cdylib", "rlib"]
