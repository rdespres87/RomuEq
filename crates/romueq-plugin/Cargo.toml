[package]
name = "romueq-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
romueq-common.workspace = true
romueq-engine.workspace = true
romueq-gui = { path = "../romueq-gui", default-features = false }
clack-plugin = "0.1"
clack-common = "0.1"
clap-sys = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
romueq-analysis = { path = "../romueq-analysis" }
egui = "0.37"
egui-wgpu = "0.31"
wgpu = "24"
raw-window-handle = "0.6"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSTimer", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSGraphics", "NSPasteboard", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }

[lib]
crate-type = ["cdylib", "rlib"]
