[package]
name = "equaform-gui"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
equaform-common.workspace = true
equaform-dsp.workspace = true
equaform-engine.workspace = true
equaform-analysis.workspace = true
egui = { version = "0.31" }
egui_plot = { version = "0.31" }
eframe = { version = "0.31", features = ["default_fonts"], optional = true }
cpal = { version = "0.15", optional = true }

[features]
default = []
standalone = ["eframe", "cpal"]
